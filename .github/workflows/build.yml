# Builds SongBridge as a stand-alone program for Windows and macOS (Apple Silicon).
# Result: downloadable as artifacts of each run under "Actions".
# Every push to master is also published as a GitHub Release – that is where the program fetches
# its updates from (updater.py). Version number: date + run number, e.g. 2026.10.09.42.
name: Build

on:
  workflow_dispatch:
  push:
    branches: ["master", "main", "claude/**"]

permissions:
  contents: write

# Two quick pushes: the older run is cancelled so an older release never overtakes a newer one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=$(date -u +%Y.%m.%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # Apple Silicon (M1 and newer); Intel Macs are no longer built
            name: macOS-AppleSilicon
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Version number
        shell: bash
        run: echo '__version__ = "${{ needs.version.outputs.version }}"' > songbridge/version.py
      - name: Build
        run: pyinstaller --noconfirm --clean packaging/SongBridge.spec
      - name: Smoke test
        shell: bash
        run: |
          export SONGBRIDGE_NO_UPDATE=1
          ./dist/SongBridge* --no-browser --port 5123 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5123/api/config && break; sleep 1; done
          curl -sf http://127.0.0.1:5123/api/config | grep -q '"${{ needs.version.outputs.version }}"'
          curl -sf http://127.0.0.1:5123/ > /dev/null
      - name: Package
        shell: bash
        run: |
          mkdir -p pkg
          cp dist/SongBridge* pkg/
          cp docs/GUIDE.md docs/ANLEITUNG.md pkg/
          cp songbridge/propresenter/proto/LICENSE-ProPresenter7-Proto pkg/
          (cd pkg && 7z a ../SongBridge-${{ matrix.name }}.zip . > /dev/null)
      - uses: actions/upload-artifact@v4
        with:
          name: SongBridge-${{ matrix.name }}
          path: SongBridge-${{ matrix.name }}.zip

  release:
    if: github.ref == 'refs/heads/master'
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: SongBridge ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message }}
          make_latest: true
          files: dist/*.zip
